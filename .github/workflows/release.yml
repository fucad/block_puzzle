# Release build: produces store-ready artifacts on a version tag (v*) or
# on demand. It never uploads to a store — that stays a manual owner step
# (docs/RELEASE_CHECKLIST.md).
#
# Android signing uses four repository secrets (Settings ▸ Secrets ▸
# Actions). Without them the job still builds, debug-signed, and says so.
#   ANDROID_KEYSTORE_BASE64   base64 of the upload .jks  (base64 -i upload.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - name: Gate — analyze + tests + quest content
        run: |
          flutter analyze
          flutter test --exclude-tags golden
          dart run tool/validate_quests.dart
      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing secrets — building a debug-signed AAB (not uploadable to Play)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties
      - name: Build AAB
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: block_puzzle-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Remove key material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"

  ios:
    # Unsigned compile check only: signing + upload happen in Xcode on the
    # owner's Mac (Product ▸ Archive), see docs/RELEASE_CHECKLIST.md.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
